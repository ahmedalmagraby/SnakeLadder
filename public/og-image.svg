<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Snake and Ladder — Race to Square 100">
  <defs>
    <radialGradient id="glowA" cx="18%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="96%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="ladderWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#06120d" />
  <rect width="1200" height="630" fill="url(#glowA)" />
  <rect width="1200" height="630" fill="url(#glowB)" />

  <!-- board grid, bottom-left, cropped for the card -->
  <g opacity="0.20" transform="translate(60 150)">
    <g fill="none" stroke="#6ee7b7" stroke-width="1.5">
      <rect x="0" y="0" width="420" height="420" rx="10" />
      <path d="M0 60h420M0 120h420M0 180h420M0 240h420M0 300h420M0 360h420" />
      <path d="M60 0v420M120 0v420M180 0v420M240 0v420M300 0v420M360 0v420" />
    </g>
  </g>

  <!-- snake -->
  <g transform="translate(140 400) scale(1.35)">
    <path
      d="M0 60c0-40 46-32 54-70 6-30-16-50 12-62"
      fill="none"
      stroke="url(#body)"
      stroke-width="26"
      stroke-linecap="round"
    />
    <circle cx="70" cy="-78" r="20" fill="#4ade80" />
    <circle cx="64" cy="-82" r="5" fill="#022c22" />
    <path d="M86-92l16-8M86-92l4 16" stroke="#4ade80" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- ladder -->
  <g transform="translate(470 250) scale(1.5)" stroke="url(#ladderWood)" stroke-width="10" stroke-linecap="round">
    <line x1="0" y1="200" x2="60" y2="0" />
    <line x1="70" y1="200" x2="130" y2="0" />
    <line x1="18" y1="150" x2="88" y2="150" />
    <line x1="36" y1="100" x2="106" y2="100" />
    <line x1="54" y1="50" x2="124" y2="50" />
  </g>

  <!-- wordmark -->
  <g font-family="'Lilita One', 'Trebuchet MS', system-ui, sans-serif" text-anchor="middle">
    <text x="880" y="300" font-size="118" fill="#d1fae5" letter-spacing="2">SNAKE</text>
    <text x="880" y="410" font-size="104" fill="#fbbf24" letter-spacing="2">&amp; LADDER</text>
  </g>
  <text
    x="880"
    y="470"
    text-anchor="middle"
    font-family="'Nunito', system-ui, sans-serif"
    font-size="34"
    font-weight="800"
    fill="#a7f3d0"
    opacity="0.9"
  >
    Race to square 100
  </text>
  <g transform="translate(700 500)">
    <rect x="0" y="0" width="360" height="58" rx="29" fill="#fbbf24" />
    <text
      x="180"
      y="39"
      text-anchor="middle"
      font-family="'Nunito', system-ui, sans-serif"
      font-size="26"
      font-weight="900"
      fill="#1c1917"
    >
      PLAY ONLINE &#183; 5 THEMES
    </text>
  </g>
</svg>
