<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Snake and Ladder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- ladder -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="50" x2="48" y2="14" />
    <line x1="50" y1="50" x2="58" y2="14" />
    <line x1="42" y1="40" x2="52" y2="40" />
    <line x1="45" y1="28" x2="55" y2="28" />
  </g>
  <!-- snake -->
  <path
    d="M10 50c0-10 12-8 14-18 1.6-8-4-13 3-16"
    fill="none"
    stroke="url(#body)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <circle cx="28" cy="14" r="5" fill="#4ade80" />
  <circle cx="26" cy="13" r="1.4" fill="#022c22" />
  <path d="M31 10l4-2M31 10l1 4" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" />
</svg>
